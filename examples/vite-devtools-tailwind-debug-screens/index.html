<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>vite-devtools-tailwind-debug-screens</title>
		<link rel="stylesheet" href="/src/style.css" />
	</head>
	<body>
		<main>
			<h1>vite-devtools-tailwind-debug-screens</h1>
			<p>
				Resize the window and watch the pill in the bottom-right
				corner update as it crosses tailwind's default breakpoints.
			</p>
			<div class="grid">
				<div class="tile">1</div>
				<div class="tile">2</div>
				<div class="tile">3</div>
				<div class="tile">4</div>
				<div class="tile">5</div>
				<div class="tile">6</div>
			</div>
		</main>
	</body>
</html>
